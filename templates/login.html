<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AgriSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('home') }}" class="logo">
        Agri<span>Smart</span> 🌱
    </a>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('login') }}" class="active">Login</a>
        <a href="{{ url_for('register') }}">Register</a>

    </div>

</nav>


<section class="auth-page">

    <div class="auth-card">

        <div style="text-align:center; font-size:50px;">
            🌱
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Login to continue to AgriSmart
        </p>


        {% if message %}

            <div class="
                alert
                {% if message_type == 'success' %}
                    alert-success
                {% else %}
                    alert-error
                {% endif %}
            ">

                {{ message }}

            </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-green auth-submit"
            >
                Login
            </button>

        </form>


        <div class="auth-bottom">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Register here
            </a>

        </div>

    </div>

</section>


<footer class="footer">

    <p>
        <strong>AgriSmart</strong> —
        Smart Farming Advisory System
    </p>

</footer>

</body>
</html>
