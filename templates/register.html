<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AgriSmart</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<nav class="navbar">

    <a href="{{ url_for('home') }}" class="logo">
        Agri<span>Smart</span> 🌱
    </a>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('login') }}">Login</a>
        <a href="{{ url_for('register') }}" class="active">
            Register
        </a>

    </div>

</nav>


<section class="auth-page">

    <div class="auth-card">

        <div style="text-align:center; font-size:50px;">
            🌾
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Register to access AgriSmart
        </p>


        {% if message %}

            <div class="
                alert
                {% if message_type == 'success' %}
                    alert-success
                {% else %}
                    alert-error
                {% endif %}
            ">

                {{ message }}

            </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Select Role</label>

                <select name="role" required>

                    <option value="">
                        Select your role
                    </option>

                    <option value="farmer">
                        Farmer
                    </option>

                    <option value="student">
                        Student
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Create password"
                    required
                >

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-green auth-submit"
            >
                Create Account
            </button>

        </form>


        <div class="auth-bottom">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login here
            </a>

        </div>

    </div>

</section>


<footer class="footer">

    <p>
        <strong>AgriSmart</strong> —
        Smart Farming Advisory System
    </p>

</footer>

</body>
</html>
